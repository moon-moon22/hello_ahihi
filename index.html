<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello</title>
<style>
  :root{
    --bg:#02040a;
    --rain:#3a6cff;
    --rain-dim:#1a2a66;
    --text-glow:#2e6bff;
    --accent:#ff4d6d;
  }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    overflow:hidden; font-family:'Courier New', monospace;
  }
  canvas{ position:fixed; inset:0; display:block; }

  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:0 6vw;
  }

  .msgline{
    font-family: 'Arial Black', 'Segoe UI Black', sans-serif;
    font-weight:900;
    font-size:clamp(28px, 9vw, 64px);
    line-height:1.15;
    color:var(--text-glow);
    text-shadow:
      00 0 10px rgba(46,107,255,0.85),
      0 0 30px rgba(20,60,200,0.6);
    white-space:pre-wrap;
    max-width:900px;
    min-height:0;
  }

  .cursor{
    display:inline-block;
    width:0.5ch;
    background:var(--accent);
    margin-left:4px;
    animation:blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #hint{
    position:fixed; bottom:28px; left:0; right:0;
    text-align:center; color:#5b6ba8; font-size:12px;
    letter-spacing:1px; font-family:Arial, sans-serif;
    opacity:0.8;
  }

  #photo-wrap{
    margin-top:32px;
    opacity:0;
    transform:translateY(16px) rotate(-2deg);
    transition:opacity 0.9s ease, transform 0.9s ease;
  }
  #photo-wrap.show{
    opacity:1;
    transform:translateY(0) rotate(-2deg);
  }
  #photo{
    max-width:min(70vw, 320px);
    max-height:42vh;
    display:block;
    border:10px solid #f4f2ea;
    border-bottom-width:36px;
    border-radius:2px;
    box-shadow:0 18px 40px rgba(0,0,0,0.55);
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="stage">
  <div id="text-before" class="msgline"></div>
  <div id="photo-wrap">
    <img id="photo" src="photo.jpg" alt="">
  </div>
  <div id="text-after" class="msgline"></div>
</div>

<script>
/* ================= CẤU HÌNH ================= */
// Đổi lời nhắn ở đây, hoặc truyền qua URL: ?msg=Loi%20nhan%20cua%20ban
// Đặt [IMG] ở chỗ bạn muốn ảnh xuất hiện, chữ sẽ ngưng gõ, hiện ảnh, rồi gõ tiếp phần còn lại
const params = new URLSearchParams(location.search);
const MESSAGE = params.get('msg') || "Chào anh 🌊🌅!\n[IMG]\nMình làm quen nhé 😄\nChúc anh một buổi tối vui vẻ ☺️ kiki";
const RAIN_WORDS = ["LOVE","YOU","U&I","YÊU","❤"];
/* ============================================= */

// ---------- Hiệu ứng mưa ký tự kiểu Matrix ----------
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
let w, h, columns, drops;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  const fontSize = 18;
  columns = Math.floor(w / fontSize);
  drops = new Array(columns).fill(0).map(()=> Math.random()*-50);
}
resize();
window.addEventListener('resize', resize);

function randomGlyph(){
  if (Math.random() < 0.12){
    const word = RAIN_WORDS[Math.floor(Math.random()*RAIN_WORDS.length)];
    return word[Math.floor(Math.random()*word.length)];
  }
  const chars = "01LOVE❤YOUABCDEFGHIJKLMNOPQRSTUVWXYZ";
  return chars[Math.floor(Math.random()*chars.length)];
}

function drawRain(){
  ctx.fillStyle = "rgba(2,4,10,0.16)";
  ctx.fillRect(0,0,w,h);

  const fontSize = 18;
  ctx.font = fontSize + "px monospace";

  for (let i=0; i<columns; i++){
    const x = i*fontSize;
    const y = drops[i]*fontSize;

    // ký tự sáng đầu dòng
    ctx.fillStyle = "#cfe0ff";
    ctx.fillText(randomGlyph(), x, y);

    // đuôi mờ dần
    ctx.fillStyle = "rgba(58,108,255,0.55)";
    ctx.fillText(randomGlyph(), x, y - fontSize);

    if (y > h && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
  requestAnimationFrame(drawRain);
}
drawRain();

// ---------- Hiệu ứng gõ chữ, dừng giữa chừng để hiện ảnh ----------
const elBefore = document.getElementById('text-before');
const elAfter = document.getElementById('text-after');
const photoWrap = document.getElementById('photo-wrap');

// tách lời nhắn thành phần trước / sau theo dấu [IMG]
const rawParts = MESSAGE.split(/\n?\[IMG\]\n?/);
const textBefore = rawParts[0] || "";
const textAfter = rawParts.length > 1 ? rawParts.slice(1).join("\n") : "";

function typeInto(el, text, onDone){
  el.textContent = "";
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.innerHTML = "&nbsp;";

  let i = 0;
  function step(){
    if (i <= text.length){
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      i++;
      setTimeout(step, 90 + Math.random()*70);
    } else {
      cursor.remove();
      if (onDone) onDone();
    }
  }
  step();
}

function playSequence(){
  elBefore.textContent = "";
  elAfter.textContent = "";
  photoWrap.classList.remove('show');

  typeInto(elBefore, textBefore, ()=>{
    if (!textAfter){
      // không có phần sau -> chỉ hiện ảnh nếu có [IMG], xong thì thôi
      if (MESSAGE.includes('[IMG]')) setTimeout(()=> photoWrap.classList.add('show'), 300);
      return;
    }
    // dừng 1 chút rồi hiện ảnh
    setTimeout(()=>{
      photoWrap.classList.add('show');
      // đợi ảnh hiện xong rồi gõ tiếp phần sau
      setTimeout(()=> typeInto(elAfter, textAfter), 1100);
    }, 400);
  });
}

playSequence();
document.body.addEventListener('click', playSequence);
</script>

</body>
</html>
